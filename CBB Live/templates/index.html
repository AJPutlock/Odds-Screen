<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CBB Live Hub</title>
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
  <header>
    <div class="brand">CBB <span>Live</span></div>
    <div class="tabs" id="tabs">
      <button class="tab active" data-state="in">Live <span class="badge" id="c-in">0</span></button>
      <button class="tab" data-state="pre">Upcoming <span class="badge" id="c-pre">0</span></button>
      <button class="tab" data-state="post">Final <span class="badge" id="c-post">0</span></button>
      <button class="tab" data-state="all">All <span class="badge" id="c-all">0</span></button>
    </div>
    <div class="spacer"></div>
    <div class="status">
      <span><span class="dot" id="pulse"></span> <span id="updated">connecting</span></span>
      <span class="odds-age" id="odds-age"></span>
      <span id="quota"></span>
      <button class="btn" id="refresh">Refresh</button>
    </div>
  </header>

  <main>
    <div class="board" id="board"></div>
    <div class="empty" id="empty" style="display:none"></div>
  </main>

  <script src="/static/js/scoreboard.js"></script>
</body>
</html>
